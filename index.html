<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قلبك ❤ love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBE4EA; --bg2:#F6CBD6; --heart:#C8143F; --heart-dk:#8E0B2C;
  --ink:#3B0A1A; --soft:#7A3A4C; --glow:rgba(200,20,63,.28);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A0712; --bg2:#430B1E; --heart:#FF3D6A; --heart-dk:#C8143F;
    --ink:#FFE3EA; --soft:#E9A9B9; --glow:rgba(255,61,106,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A0712; --bg2:#430B1E; --heart:#FF3D6A; --heart-dk:#C8143F;
  --ink:#FFE3EA; --soft:#E9A9B9; --glow:rgba(255,61,106,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 40%,var(--bg2),var(--bg) 70%);
  background-color:var(--bg);
  color:var(--ink);
  font-family:"Aref Ruqaa","Traditional Arabic","Times New Roman",serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;padding:1.5rem;
}
h1{
  font-size:clamp(3.5rem,14vw,7rem);font-weight:700;line-height:1;
  color:var(--heart-dk);
}
:root[data-theme="dark"] h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}

.heart-btn{
  position:relative;margin:1.5rem 0 1rem;border:0;background:none;cursor:pointer;
  width:min(72vw,320px);aspect-ratio:1;padding:0;
  -webkit-tap-highlight-color:transparent;border-radius:50%;
}
.heart-btn:focus-visible{outline:3px dashed var(--heart);outline-offset:8px}
.heart-btn svg{width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 18px 40px var(--glow));
  animation:beat 1.2s ease-in-out infinite;transform-origin:50% 55%}
.heart-btn:active svg{animation:none;transform:scale(.9)}
.heart-shape{fill:var(--heart)}
.love{
  font-family:"Great Vibes","Brush Script MT",cursive;
  fill:#fff;font-size:58px;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.09)}
  28%{transform:scale(.98)}
  42%{transform:scale(1.06)}
  70%{transform:scale(1)}
}
.msg{font-size:clamp(1.3rem,5vw,1.9rem);max-width:22ch;line-height:1.6;color:var(--ink)}
.count{margin-top:.9rem;font-size:1.1rem;color:var(--soft)}
.theme{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;
  border:1.5px solid var(--soft);background:transparent;color:var(--ink);
  border-radius:999px;width:44px;height:44px;font-size:1.2rem;cursor:pointer;
}
.theme:focus-visible{outline:3px solid var(--heart);outline-offset:2px}

.fly{
  position:fixed;pointer-events:none;color:var(--heart);
  animation:rise var(--d,2.4s) ease-out forwards;will-change:transform,opacity;
}
@keyframes rise{
  0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
  100%{transform:translate(var(--x),-75vh) scale(1.3) rotate(var(--r));opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .heart-btn svg{animation:none}
  .fly{animation-duration:.01s}
}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تبديل الوضع الفاتح والداكن">◐</button>

<h1>قلبك</h1>

<button class="heart-btn" id="heart" aria-label="أرسل قلب">
  <svg viewBox="0 0 200 180" aria-hidden="true">
    <path class="heart-shape" d="M100 172C46 128 6 96 6 54 6 26 28 6 54 6c20 0 36 11 46 28C110 17 126 6 146 6c26 0 48 20 48 48 0 42-40 74-94 118z"/>
    <text class="love" x="100" y="92" text-anchor="middle" dominant-baseline="middle">love</text>
  </svg>
</button>

<p class="msg">في قلبي مكان ما يسكنه غيرك</p>
<p class="count" id="count" aria-live="polite">اضغط على القلب</p>

<script>
(function(){
  var heart=document.getElementById('heart');
  var countEl=document.getElementById('count');
  var n=0;
  try{n=parseInt(localStorage.getItem('qalbak-n')||'0',10)||0}catch(e){}
  function show(){
    if(n>0) countEl.textContent='أرسلت '+n.toLocaleString('ar')+' قلب ❤';
  }
  show();

  function burst(x,y){
    var shapes=['❤','♥','❥'];
    for(var i=0;i<9;i++){
      var s=document.createElement('span');
      s.className='fly';
      s.textContent=shapes[i%shapes.length];
      s.style.left=(x-12)+'px';
      s.style.top=(y-12)+'px';
      s.style.fontSize=(16+Math.random()*26)+'px';
      s.style.setProperty('--x',((Math.random()-.5)*260)+'px');
      s.style.setProperty('--r',((Math.random()-.5)*80)+'deg');
      s.style.setProperty('--d',(1.8+Math.random()*1.4)+'s');
      document.body.appendChild(s);
      s.addEventListener('animationend',function(){this.remove()});
    }
  }

  heart.addEventListener('click',function(ev){
    var r=heart.getBoundingClientRect();
    var x=ev.clientX||r.left+r.width/2, y=ev.clientY||r.top+r.height/2;
    burst(x,y);
    n++;
    try{localStorage.setItem('qalbak-n',String(n))}catch(e){}
    show();
    if(navigator.vibrate){try{navigator.vibrate(30)}catch(e){}}
  });

  // الوضع الفاتح والداكن
  var root=document.documentElement, btn=document.getElementById('theme');
  try{var t=localStorage.getItem('qalbak-theme'); if(t) root.setAttribute('data-theme',t);}catch(e){}
  btn.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||
      (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('qalbak-theme',next)}catch(e){}
  });
})();
</script>
</body>
</html>
